# Local infrastructure shared by all labs. Throwaway containers: no real data, nothing exposed beyond localhost.
#   docker compose up -d      start
#   docker compose down -v    stop and delete the data
#
# Ports are not the defaults (1433, 6379), so the labs never clash with a SQL Server or Redis you already run.
# Settings come from .env (copy .env.example). Same image versions as the blog's integration tests.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env first}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.6
    ports:
      - "127.0.0.1:63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sqlserver-data:
